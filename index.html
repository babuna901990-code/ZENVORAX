<!DOCTYPE html>
<html>
<head>
    <title>Veg Store</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        .card {
            border: 1px solid #ccc;
            padding: 15px;
            width: 200px;
            border-radius: 10px;
            margin-top: 10px;
        }

        button {
            padding: 8px 12px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>🥦 Veg Store</h1>

    <div class="card">
        <h2>Tomato</h2>
        <p>Price: ₹20/kg</p>
        <button onclick="order()">Order Now</button>
    </div>

    <p id="msg"></p>

    <script>
        let stock = 5;

        function order() {
            if (stock > 0) {
                stock--;
                document.getElementById("msg").innerText =
                    "Order successful! Remaining stock: " + stock;
            } else {
                document.getElementById("msg").innerText =
                    "Out of stock!";
            }
        }
    </script>

</body>
</html>
